name: Daily OFAC Data Refresh & Deploy

on:
  schedule:
    # Runs at 09:00 UTC every day (Treasury publishes updates multiple times/week)
    - cron: '0 9 * * *'
  workflow_dispatch:     # manual trigger from GitHub UI
  push:
    branches: [master]   # deploy on push too

env:
  SITE_BASE: https://ofac-sdn-directory.vercel.app

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fresh OFAC data from U.S. Treasury
        run: python3 src/fetch_data.py

      - name: Rebuild static site
        run: SITE_BASE="${{ env.SITE_BASE }}" python3 src/build.py

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          working-directory: ./

      - name: Notify IndexNow (Bing/Yandex/Seznam/Naver)
        if: success()
        run: |
          KEY="267c17db-a184-4de7-9a3a-b5896bad1d3c0000"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"ofac-sdn-directory.vercel.app\",\"key\":\"$KEY\",\"urlList\":[\"$SITE_BASE/\",\"$SITE_BASE/wallets/\"]}"

      - name: Summary
        if: always()
        run: |
          echo "📊 Site: $SITE_BASE"
          echo "📂 Repo: https://github.com/${{ github.repository }}"
          echo "📅 Data refreshed: $(date -u)"
